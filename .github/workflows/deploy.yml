name: Deploy to Pages Repo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout origin repo
        uses: actions/checkout@v3

      - name: Checkout pages repo
        uses: actions/checkout@v3
        with:
          repository: Nitro-and-Halo-Projects/testapplication.github.io
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: pages-repo

      - name: Copy files to pages repo (exclude .github)
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            ./ pages-repo/
          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from TestApplication" || echo "No changes to commit"
          git push origin main
