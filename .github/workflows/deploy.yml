name: Deploy to Pages Repo

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

# Add permissions for the GITHUB_TOKEN
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for better git operations

      - name: Checkout pages repo
        uses: actions/checkout@v4
        with:
          repository: Nitro-and-Halo-Projects/testapplication.github.io
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: testapplication.github.io
          fetch-depth: 0

      - name: Copy files to pages repo
        run: |
          # Clean the pages repo but preserve .git directory
          find testapplication.github.io -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          
          # Copy all files from source to pages repo
          echo "Copying all files to pages repository..."
          cp -r * testapplication.github.io/ 2>/dev/null || true
          
          # Remove files/folders that shouldn't be deployed
          cd testapplication.github.io
          rm -rf .git                    # Remove any copied .git
          rm -rf .github                 # Remove GitHub Actions workflows
          rm -rf .vscode                 # Remove VS Code config
          rm -f .gitignore              # Remove gitignore
          rm -f README.md               # Remove readme
          rm -f package*.json           # Remove npm files if they exist
          rm -f *.md                    # Remove other markdown files
          rm -rf node_modules           # Remove node_modules if it exists
          rm -rf testapplication.github.io  # Remove nested directory if copied
          
          # Initialize git in the pages repo directory
          git init
          git remote add origin https://github.com/Nitro-and-Halo-Projects/testapplication.github.io.git
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          git add .
          if git diff --staged --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          
          # Commit and push changes
          git commit -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git branch -M main
          git push --set-upstream origin main

      - name: Deployment status
        if: success()
        run: echo "✅ Successfully deployed to pages repository"
